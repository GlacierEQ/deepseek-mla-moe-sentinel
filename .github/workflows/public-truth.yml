name: Public Truth Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python surfaces
        run: python -m compileall -q src tests mastermind_sidecar.py
      - name: Run deterministic architecture proof
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile C reference sources
        run: |
          gcc -std=c11 -Wall -Wextra -c src/mla_compression.c -o /tmp/mla_compression.o
          gcc -std=c11 -Wall -Wextra -c src/mla_moe_solver.c -o /tmp/mla_moe_solver.o
      - name: Verify public truth boundary
        run: |
          grep -q 'MODELED_MLA_MOE_SCENARIO_NOT_MODEL_EXECUTION' README.md
          grep -q 'not affiliated with, endorsed by, or operated by DeepSeek' README.md
